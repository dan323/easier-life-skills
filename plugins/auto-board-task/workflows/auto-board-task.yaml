# auto-board-task workflow
#
# Processes the top Todo card on a GitHub Project (v2) board end-to-end:
#
#   1. gh-project-sync       — reconcile the board into `tasks.yml`. New Todo
#                              cards land as `status: pending`; stale Done /
#                              Won't Do entries are dropped.
#   2. claim                 — gh-project-sync with `claim=true`: picks the top Todo
#                              card that has a pending entry, moves it to In
#                              Progress, and moves its entry to the front of
#                              `tasks.yml`. task-agent implements the first
#                              pending entry in file order and takes no task id,
#                              so this reorder is what guarantees the claimed
#                              card is the one implemented.
#   3. task-agent            — pick the first pending task in `tasks.yml`
#                              (the claimed one), clone the repo, do the work,
#                              open a PR, and mark the entry `status: done` with
#                              a `pr_url`.
#   4. gh-project-sync       — reconcile again. Rule 4 fires for the entry
#                              freshly marked `done + pr_url`: the card moves
#                              to In Review (or In Progress if the board has
#                              no In Review column) and the PR link is posted
#                              as a comment on the card.
#   5. review-loop          — a loop block that repeats 5a and 5b together until
#                              the review finds nothing (at most 3 passes):
#      5a. review           — pr-reviewer reviews the PR, verifies its checks in a
#                              throwaway worktree, and posts one COMMENT review
#                              with inline comments marked `<!-- pr-reviewer -->`.
#                              Replaces waiting on Copilot, which no longer
#                              reviews these PRs. It reports `findings` (open
#                              findings on the reviewed commit; 0 = clean).
#      5b. review-fix       — review-fixer applies fixes for the actionable
#                              comments from 5a (and from other trusted
#                              reviewers, if any appear), runs the repo's
#                              checks, pushes. Skipped on a clean pass.
#                              The next pass then re-reviews the new commit.
#
# If the review is still not clean after the last pass, the loop block fails
# with "max_iterations reached" but `continue_on_error` lets the run end
# `partial` instead of `failed`: the PR exists and needs a human.
#
# Needs workflow >= 1.3.0 (loop blocks) and task-agent >= 2.2.0 (`pr-reviewer`
# writes `findings`).
#
# Steps 2, 4, 5a and 5b set `inline: true`: each spawns its own sub-agent, and a
# workflow step that runs as a subagent cannot spawn further agents.
#
# See ../skills/auto-board-task/SKILL.md for the user-facing flow,
# and ../../workflow/references/format.md for the workflow YAML schema.

name: auto-board-task
description: Drain the top Todo card from a GitHub Project — sync in, run task-agent, sync out, then review the PR and fix the review comments, repeating until the review is clean.
category: automation

inputs:
  - name: tasks
    description: Path to the unified task-agent tasks.yml file.
    default: "tasks.yml"
  - name: project_url
    description: GitHub Project v2 URL (e.g. https://github.com/users/dan323/projects/4). Alternative to project_owner + project_number.
  - name: project_owner
    description: GitHub user or org that owns the project. Use together with project_number when project_url is empty.
  - name: project_number
    description: Project number as shown in the URL. Use together with project_owner when project_url is empty.
  - name: default_repo
    description: owner/repo for draft cards that aren't linked to an issue. Optional.

steps:
  - id: sync-in
    skill: gh-project-sync
    description: Reconcile the board into tasks.yml — pulls Todo cards in, drops Done / Won't Do entries.
    args:
      tasks: ${{ inputs.tasks }}
      project_url: ${{ inputs.project_url }}
      project_owner: ${{ inputs.project_owner }}
      project_number: ${{ inputs.project_number }}
      default_repo: ${{ inputs.default_repo }}

  - id: claim
    skill: gh-project-sync
    description: Claim the top Todo card — move it to In Progress and put its entry first in tasks.yml so task-agent implements exactly it.
    args:
      tasks: ${{ inputs.tasks }}
      project_url: ${{ inputs.project_url }}
      project_owner: ${{ inputs.project_owner }}
      project_number: ${{ inputs.project_number }}
      default_repo: ${{ inputs.default_repo }}
      claim: "true"

  - id: run-task
    skill: task-agent
    description: Implement the claimed task (first pending entry in tasks.yml) and open a PR.
    inline: true   # task-agent spawns the implementer; subagents cannot spawn agents
    args:
      tasks: ${{ inputs.tasks }}

  - id: sync-out
    skill: gh-project-sync
    description: Reconcile again — moves the freshly-done card to In Review and posts the PR link.
    args:
      tasks: ${{ inputs.tasks }}
      project_url: ${{ inputs.project_url }}
      project_owner: ${{ inputs.project_owner }}
      project_number: ${{ inputs.project_number }}
      default_repo: ${{ inputs.default_repo }}

  - id: review-loop
    description: Review the PR and fix the comments, repeating until the review reports no findings (at most 3 passes).
    until: ${{ steps.review.output.findings == 0 }}
    max_iterations: 3
    continue_on_error: true   # still not clean after 3 passes -> the run ends `partial`, the PR waits for a human
    steps:
      - id: review
        skill: pr-reviewer
        description: Review the PR, run its checks in a throwaway worktree, and post the findings as one review.
        inline: true   # spawns the pr-reviewer agent
        args:
          pr_url: ${{ steps.run-task.output.pr_url }}
          repo: ${{ steps.run-task.output.repo }}
          branch: ${{ steps.run-task.output.branch }}

      - id: review-fix
        skill: review-fixer
        description: Apply fixes for the actionable review comments from trusted reviewers, run the repo's checks, and push. Skipped when the review is clean.
        inline: true   # spawns the review-fixer agent
        # `!= 0`, not `> 0`: a reviewer that did not report `findings` (null) still gets its fixer run.
        if: ${{ steps.review.output.findings != 0 }}
        args:
          pr_url: ${{ steps.run-task.output.pr_url }}
          repo: ${{ steps.run-task.output.repo }}
          branch: ${{ steps.run-task.output.branch }}
          poll: 0
