# auto-board-task workflow
#
# Processes the top Todo card on a GitHub Project (v2) board end-to-end:
#
#   1. gh-project-sync       — reconcile the board into `tasks.yml`. New Todo
#                              cards land as `status: pending`; stale Done /
#                              Won't Do entries are dropped.
#   2. task-agent            — pick the first pending task in `tasks.yml`
#                              (i.e. the top of the Todo column after step 1),
#                              clone the repo, do the work, open a PR, and mark
#                              the entry `status: done` with a `pr_url`.
#   3. gh-project-sync       — reconcile again. Rule 4 fires for the entry
#                              freshly marked `done + pr_url`: the card moves
#                              to In Review (or In Progress if the board has
#                              no In Review column) and the PR link is posted
#                              as a comment on the card.
#   4. pr-reviewer           — reviews the new PR, verifies its checks in a
#                              throwaway worktree, and posts one COMMENT review
#                              with inline comments marked `<!-- pr-reviewer -->`.
#                              Replaces waiting on Copilot, which no longer
#                              reviews these PRs.
#   5. copilot-review-fixer  — applies fixes for the actionable comments from
#                              step 4 (and Copilot's, if any ever appear). Runs
#                              at the workflow level so the Agent tool is
#                              available (subagents cannot spawn further
#                              agents).
#
# See ../skills/auto-board-task/SKILL.md for the user-facing flow,
# and ../../workflow/references/format.md for the workflow YAML schema.

name: auto-board-task
description: Drain the top Todo card from a GitHub Project — sync in, run task-agent, sync out, review the PR, fix the review comments.
category: automation

inputs:
  - name: tasks
    description: Path to the unified task-agent tasks.yml file.
    default: "tasks.yml"
  - name: project_url
    description: GitHub Project v2 URL (e.g. https://github.com/users/dan323/projects/4). Alternative to project_owner + project_number.
  - name: project_owner
    description: GitHub user or org that owns the project. Use together with project_number when project_url is empty.
  - name: project_number
    description: Project number as shown in the URL. Use together with project_owner when project_url is empty.
  - name: default_repo
    description: owner/repo for draft cards that aren't linked to an issue. Optional.

steps:
  - id: sync-in
    skill: gh-project-sync
    description: Reconcile the board into tasks.yml — pulls Todo cards in, drops Done / Won't Do entries.
    args:
      tasks: ${{ inputs.tasks }}
      project_url: ${{ inputs.project_url }}
      project_owner: ${{ inputs.project_owner }}
      project_number: ${{ inputs.project_number }}
      default_repo: ${{ inputs.default_repo }}

  - id: run-task
    skill: task-agent
    description: Pick up the next pending task and open a PR.
    args:
      tasks: ${{ inputs.tasks }}

  - id: sync-out
    skill: gh-project-sync
    description: Reconcile again — moves the freshly-done card to In Review and posts the PR link.
    args:
      tasks: ${{ inputs.tasks }}
      project_url: ${{ inputs.project_url }}
      project_owner: ${{ inputs.project_owner }}
      project_number: ${{ inputs.project_number }}
      default_repo: ${{ inputs.default_repo }}

  - id: review
    skill: pr-reviewer
    description: Review the PR, run its checks in a throwaway worktree, and post the findings as one review.
    args:
      pr_url: ${{ steps.run-task.output.pr_url }}
      repo: ${{ steps.run-task.output.repo }}
      branch: ${{ steps.run-task.output.branch }}

  - id: review-fix
    skill: copilot-review-fixer
    description: Apply fixes for the actionable review comments (pr-reviewer's, and Copilot's if present).
    args:
      pr_url: ${{ steps.run-task.output.pr_url }}
      repo: ${{ steps.run-task.output.repo }}
      branch: ${{ steps.run-task.output.branch }}
