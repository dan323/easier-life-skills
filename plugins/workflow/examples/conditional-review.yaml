# Example workflow — conditions, retry and continue_on_error.
#
# Runs task-agent, then reviews and fixes the PR it opened — but only if it
# actually opened one:
#
#   - NO `retry` on `run-task`, on purpose: a retry re-runs the whole step, and
#     task-agent is not idempotent. It opens the PR (Phase 3.5) before it writes
#     the task's state (4.2) and its output (4.3), and it never checks for an
#     existing PR. A failure in between would, on retry, open a second PR for the
#     same task — or, if the task was already marked done, pick up the NEXT task
#     and hand the wrong PR to the steps below. Only retry steps that are safe to
#     repeat.
#   - `retry: 1` on `review`: pr-reviewer IS safe to repeat — it skips a commit it
#     already reviewed and never re-posts findings it already raised — so a
#     transient failure (network, `gh`) gets one more attempt. The summary
#     records how many `attempts` it took.
#   - `if:` on `review` and `review-fix`: when task-agent had nothing to do
#     (no pending task) there is no `pr_url`, an empty value is falsy, and both
#     steps are recorded as `skipped` — not failed.
#   - `continue_on_error: true` on `review-fix`: a failing fixer must not hide
#     the fact that the PR exists. The run ends `partial` instead of `failed`.
#
# Run it with, e.g.:
#
#   workflow plugins/workflow/examples/conditional-review.yaml tasks=tasks.yml
#
# See ../references/format.md for the full schema.

name: conditional-review
description: Run task-agent, then review and fix the resulting PR only if one was opened.
category: automation

inputs:
  - name: tasks
    default: "tasks.yml"
    description: Path to the unified task-agent tasks.yml file.

steps:
  - id: run-task
    skill: task-agent-workflow
    description: Pick up the next pending task and open a PR. Not retried — see the header.
    args:
      tasks: ${{ inputs.tasks }}

  - id: review
    skill: pr-reviewer-workflow
    description: Review the PR — skipped when no PR was opened. Idempotent, so safe to retry.
    if: ${{ steps.run-task.output.pr_url }}
    retry: 1
    args:
      pr_url: ${{ steps.run-task.output.pr_url }}
      repo: ${{ steps.run-task.output.repo }}
      branch: ${{ steps.run-task.output.branch }}

  - id: review-fix
    skill: review-fixer-workflow
    description: Apply fixes for actionable review comments; a failure here does not fail the run.
    if: ${{ steps.run-task.output.pr_url }}
    continue_on_error: true
    args:
      pr_url: ${{ steps.run-task.output.pr_url }}
      repo: ${{ steps.run-task.output.repo }}
      branch: ${{ steps.run-task.output.branch }}
