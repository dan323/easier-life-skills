title: "[Review] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Rate a skill from the [easier-life-skills marketplace](https://dan323.github.io/easier-life-skills/).
        One discussion per skill per person — duplicate reviews for the same skill will be ignored.

  - type: input
    id: skill
    attributes:
      label: Skill name
      description: "Exact skill name as it appears in the marketplace, e.g. `changelog`, `find-dead-code`, `document-project`"
      placeholder: changelog
    validations:
      required: true

  - type: dropdown
    id: stars
    attributes:
      label: Stars
      options:
        - "5"
        - "4"
        - "3"
        - "2"
        - "1"
    validations:
      required: true

  - type: textarea
    id: review
    attributes:
      label: Review
      description: "Share your experience with this skill (optional)"
      placeholder: "What worked well? What could be better?"
    validations:
      required: false
