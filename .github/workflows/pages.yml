name: CI / Deploy GitHub Pages

on:
  push:
    branches: [master]    # build + deploy; other branches are covered by the pull_request run
  pull_request:           # tests the merge result; a branch push would run the identical job a second time
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'   # daily at 03:00 UTC — keeps ratings fresh without code pushes

permissions:
  actions: read          # list this run's artifacts while waiting for the Pages artifact
  contents: write
  pages: write
  id-token: write
  discussions: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore tree cache
        uses: actions/cache@v4
        with:
          path: .cache/trees
          key: gh-trees-v2-${{ hashFiles('marketplaces.json') }}
          restore-keys: gh-trees-v2-

      - name: Install dependencies
        run: npm ci

      - name: Ingest ratings from GitHub Discussions
        run: npm run ingest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate skills_index.json, CATALOG.md, and marketplace.json
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}

      - name: Run tests
        run: npm test

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore tree cache
        uses:   actions/cache@v4
        with:
          path: .cache/trees
          key: gh-trees-v2-${{ hashFiles('marketplaces.json') }}
          restore-keys: gh-trees-v2-

      - name: Install dependencies
        run: npm ci

      - name: Ingest ratings from GitHub Discussions
        run: npm run ingest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate skills_index.json, CATALOG.md, and marketplace.json
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}

      - name: Commit marketplace.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/marketplace.json
          if git diff --cached --quiet; then
            echo "marketplace.json unchanged, skipping commit"
          else
            git commit -m "chore: regenerate marketplace.json [skip ci]"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      # deploy-pages looks the artifact up through the same API right after it is finalized and can
      # race it ("Found 0 artifact(s)"). Wait until the artifact is listed so the deploy is deterministic.
      - name: Wait for the Pages artifact to be listed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts"                   --jq '[.artifacts[] | select(.name == "github-pages" and (.expired | not))] | length')
            if [ "${n:-0}" -ge 1 ]; then
              echo "github-pages artifact is listed (attempt $i)"
              exit 0
            fi
            echo "github-pages artifact not listed yet (attempt $i/30)"
            sleep 2
          done
          echo "::error::github-pages artifact was not listed within 60s"
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
