name: Add a marketplace
description: Submit your own Claude Code skill marketplace to be listed here
labels: ["marketplace"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing your marketplace! Fill in the details below and we'll review it.

  - type: input
    id: repo
    attributes:
      label: Repository (owner/repo)
      description: The GitHub repository that hosts your marketplace
      placeholder: "yourname/your-skills"
    validations:
      required: true

  - type: input
    id: description
    attributes:
      label: Short description
      description: One sentence describing what skills your marketplace offers
      placeholder: "A collection of skills for data science workflows"
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Requirements
      description: Please confirm your marketplace meets these criteria
      options:
        - label: The repository publishes a `skills_index.json` file (generated by a compatible build script)
          required: true
        - label: The repository has an open-source LICENSE file
          required: true
        - label: At least one skill or plugin is included
          required: true
